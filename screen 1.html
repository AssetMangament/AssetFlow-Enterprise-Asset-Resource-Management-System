<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetFlow - Authentication</title>
  <style>
    /* Global Reset & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
    }

    /* Card Layout */
    .login-card {
      background-color: #ffffff;
      width: 400px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    /* Header Bar */
    .card-header {
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 16px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    /* Body Container */
    .card-body {
      padding: 24px 32px 32px 32px;
    }

    /* Circular Logo Avatar */
    .avatar-container {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #38bdf8;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* TABS */
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 600;
      color: #94a3b8;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      font-size: 0.95rem;
    }
    .tab-btn.active {
      color: #0ea5e9;
      border-bottom: 2px solid #0ea5e9;
    }
    .hidden {
      display: none;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      background-color: #ffffff;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    /* Forgot Password Link */
    .forgot-link {
      display: block;
      text-align: right;
      color: #0284c7;
      font-size: 0.85rem;
      text-decoration: none;
      margin-top: -12px;
      margin-bottom: 24px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #0369a1;
      text-decoration: underline;
    }

    /* Separator Line */
    .divider {
      border: 0;
      height: 1px;
      background-color: #e2e8f0;
      margin-bottom: 24px;
    }

    /* Bottom Info Section */
    .info-box {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 8px;
      margin-bottom: 24px;
    }

    .info-box p {
      font-size: 0.85rem;
      color: #166534;
      line-height: 1.5;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #0f172a;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #1e293b;
      border-color: #1e293b;
      transform: translateY(-1px);
    }
    
    .btn-submit:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="card-header">
      AssetFlow
    </div>
    
    <div class="card-body">
      <div class="avatar-container">
        <div class="avatar">AF</div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" onclick="toggleForm('login')">Login</button>
        <button class="tab-btn" id="tabSignup" onclick="toggleForm('signup')">Sign Up</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="**********" required>
        </div>

        <a href="#" class="forgot-link">Forgot password</a>
        <button type="submit" class="btn-submit">Login</button>
      </form>

      <form id="signupForm" class="hidden">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="**********" required>
        </div>

        <hr class="divider">

        <div class="form-group">
          <label>New here?</label>
          <div class="info-box">
            <p>Sign up creates an employee account<br>admin roles assigned later</p>
          </div>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>

    </div>
  </div>

<script>
  // Backend API URL
  const API_URL = "http://127.0.0.1:8000";

  // Form Toggle Logic
  function toggleForm(type) {
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");

    if (type === 'login') {
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
    } else {
      signupForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
    }
  }

  // --- SIGNUP LOGIC ---
  const signupForm = document.getElementById("signupForm");
  const signupEmailInput = document.getElementById("signupEmail");
  const signupPasswordInput = document.getElementById("signupPassword");
  const signupBtn = signupForm.querySelector(".btn-submit");

  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault(); 
    const emailValue = signupEmailInput.value;
    const passwordValue = signupPasswordInput.value;
    const nameValue = emailValue.split('@')[0];

    const userData = { name: nameValue, email: emailValue, password: passwordValue };

    try {
      signupBtn.innerText = "Creating Account...";
      signupBtn.style.opacity = "0.7";

      const response = await fetch(`${API_URL}/api/signup`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(userData)
      });

      const result = await response.json();

      if (response.ok) {
        alert("Account created successfully! Welcome " + result.name);
        window.location.href = "screen2.html"; 
      } else {
        if (result.detail && Array.isArray(result.detail)) {
          alert("Input Error: " + result.detail[0].msg);
        } else {
          alert("Error: " + (result.detail || "Something went wrong"));
        }
      }
    } catch (error) {
      console.error("Fetch error:", error);
      alert("Backend server se connect nahi ho paya. Kya FastAPI chal raha hai?");
    } finally {
      signupBtn.innerText = "Create Account";
      signupBtn.style.opacity = "1";
    }
  });

  // --- LOGIN LOGIC ---
  const loginForm = document.getElementById("loginForm");
  const loginEmailInput = document.getElementById("loginEmail");
  const loginPasswordInput = document.getElementById("loginPassword");
  const loginBtn = loginForm.querySelector(".btn-submit");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const emailValue = loginEmailInput.value;
    const passwordValue = loginPasswordInput.value;

    try {
      loginBtn.innerText = "Logging in...";
      loginBtn.style.opacity = "0.7";

      const response = await fetch(`${API_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailValue, password: passwordValue })
      });

      const result = await response.json();

      if (response.ok) {
        alert("Login successful! Welcome back.");
        window.location.href = "screen2.html"; 
      } else {
        alert("Login Failed: " + (result.detail || "Check your credentials"));
      }
    } catch (error) {
      console.error("Fetch error:", error);
      alert("Backend server se connect nahi ho paya.");
    } finally {
      loginBtn.innerText = "Login";
      loginBtn.style.opacity = "1";
    }
  });
</script>
</body>
</html>
